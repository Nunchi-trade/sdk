[package]
name = "nunchi-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Nunchi SDK for Commonware blockchains."

[dependencies]
axum = "0.8.8"
bytes = "1.7.1"
clap = { version = "4.5.18", features = ["derive"] }
commonware-actor = "2026.5.0"
commonware-broadcast = "2026.5.0"
commonware-codec = "2026.5.0"
commonware-consensus = { version = "2026.5.0", features = ["mocks"] }
commonware-cryptography = { version = "2026.5.0", features = ["mocks"] }
commonware-formatting = "2026.5.0"
commonware-p2p = "2026.5.0"
commonware-parallel = "2026.5.0"
commonware-resolver = "2026.5.0"
commonware-runtime = "2026.5.0"
commonware-storage = "2026.5.0"
commonware-utils = "2026.5.0"
futures = "0.3.31"
governor = "0.10.2"
rand = "0.8.5"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
tokio = { version = "1.41.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1.41"
